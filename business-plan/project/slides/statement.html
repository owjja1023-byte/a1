<h2 style="font-family:'Noto Serif KR', Georgia, serif;font-size:120px;font-weight:700;line-height:1.2">AI가 묻고,<br>연구자는 답한다.</h2>
<p style="font-size:40px;line-height:1.5;color:#E8EEFF;width:1400px">프롬프트를 잘 쓰는 사람이 아니라, 자기 연구를 가장 잘 아는 사람이 좋은 논문을 쓰도록 — 결정과 검수는 연구자가, 구조화·코드·표 작성은 AI가 맡습니다.</p>
<aside>그래서 저희는 방향을 뒤집었습니다. 사람이 AI에게 잘 묻는 게 아니라, AI가 연구자에게 필요한 것을 차례로 묻습니다. 연구자는 자기 연구에 대해 답하고, 결과물을 검수하고 승인하는 역할에 집중합니다.</aside>
