<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 수 세기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #e3f4c8;
    color: #222;
  }
  .top {
    background: #f0f9e1;
    border-bottom: 1px solid #cfe8a8;
    padding: 48px 16px 40px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    margin: 0 0 24px;
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #03c75a;
  }
  .search {
    display: flex;
    border: 2px solid #03c75a;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
  }
  textarea {
    flex: 1;
    height: 160px;
    padding: 14px 16px;
    border: none;
    outline: none;
    resize: vertical;
    font: inherit;
    font-size: 17px;
  }
  textarea::placeholder { color: #a0a4a8; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  label { margin-right: auto; font-size: 15px; color: #555; }
  #limit {
    width: 100px;
    margin-left: 6px;
    padding: 7px 10px;
    border: 1px solid #d3d5d7;
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
  }
  #limit:focus { outline: none; border-color: #03c75a; }
  button {
    padding: 10px 20px;
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #btn { border: 1px solid #03c75a; background: #03c75a; color: #fff; }
  #btn:hover { background: #02b351; }
  #clear { border: 1px solid #d3d5d7; background: #fff; color: #555; }
  #clear:hover { background: #f5f6f7; }
  .main { padding: 24px 16px; }
  #result {
    padding: 20px 24px;
    border: 1px solid #e3e5e8;
    border-radius: 12px;
    background: #fff;
    font-size: 18px;
  }
  #result span { font-weight: 800; color: #03c75a; }
  #result span.over { color: red; }
</style>
</head>
<body>
  <div class="top">
    <div class="wrap">
      <h1>글자 수 세기</h1>
      <div class="search">
        <textarea id="input" placeholder="여기에 글을 입력하세요"></textarea>
      </div>
      <div class="controls">
        <label>제한 글자 수 <input type="number" id="limit" min="0" placeholder="예: 100"></label>
        <button id="btn">글자 수 확인</button>
        <button id="clear">전체 지우기</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="wrap">
      <div id="result">전체 <span id="total"></span>자 (공백 제외 <span id="noSpace"></span>자)</div>
    </div>
  </div>

  <script>
    function update() {
      var text = document.getElementById('input').value;
      var total = Array.from(text).length;
      var noSpace = Array.from(text.replace(/\s/g, '')).length;
      var limitValue = document.getElementById('limit').value;
      var limit = limitValue === '' ? Infinity : Number(limitValue);
      var totalEl = document.getElementById('total');
      var noSpaceEl = document.getElementById('noSpace');
      totalEl.textContent = total;
      noSpaceEl.textContent = noSpace;
      totalEl.classList.toggle('over', total > limit);
      noSpaceEl.classList.toggle('over', noSpace > limit);
      document.getElementById('result').style.visibility = 'visible';
    }
    document.getElementById('result').style.visibility = 'hidden';
    document.getElementById('btn').addEventListener('click', update);
    document.getElementById('input').addEventListener('input', update);
    document.getElementById('limit').addEventListener('input', update);
    document.getElementById('clear').addEventListener('click', function () {
      document.getElementById('input').value = '';
      update();
    });
  </script>
</body>
</html>
